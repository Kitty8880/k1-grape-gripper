# ============================================================================
# 葡萄无损夹取 — 硬件与算法参数
# ============================================================================
# 所有硬件相关的"魔法数字"都集中在这里。改参数不需要动代码。
# 标定完成后，把 calibrate_* 工具跑出来的值填回本文件。
# ============================================================================

hardware:
  # 全局仿真开关：
  #   false — 访问真实硬件（舵机 / PS01 传感器），★ 本项目当前状态
  #   true  — 全部走模拟，可在没有硬件的电脑上跑通逻辑
  #
  # 注意：apps/grip_test.py 支持 --sim 参数强制模拟，
  #      所以即使这里是 false，也能用 --sim 做纯软件验证。
  simulate: false

# ---------------------------------------------------------------------------
# 夹爪舵机
# ---------------------------------------------------------------------------
servo:
  # 驱动方式：
  #   "busy_pwm"   — ★ 忙等 PWM，抖动最小（K1 上实测推荐）
  #   "lgpio_pwm"  — gpiozero + lgpio 软件 PWM（可用，但有可见抖动）
  #   "sysfs_pwm"  — Linux /sys/class/pwm/pwmchipN（K1 原生 PWM 未引到 40Pin）
  #   "gpio_soft"  — Python 位翻转软件 PWM（抖动大，仅应急）
  #   "serial_bus" — 总线舵机，走串口（如 LX-224 / STS 系列），后续扩展
  #
  # 实测对比（apps/servo_busy_pwm.py --compare）：
  #   gpiozero 软件 PWM  → 抖动可见
  #   忙等 PWM           → 明显更稳（代价：约 7.5% 的一个 CPU 核）
  driver: busy_pwm

  # ---- busy_pwm / lgpio_pwm 参数 ----
  gpio_pin: 49           # ★ GPIO_49 = 物理引脚 22
  gpio_chip: 0           # /dev/gpiochip0
  #
  # ⚠️ 为什么是 49 而不是官方图上标的其他脚？
  #    K1 的设备树 (pinctrl-single,gpio-range) 只把部分引脚配置为 GPIO。
  #    40Pin 上只有 GPIO_49（引脚 22）同时满足：
  #      · 默认 MUX_MODE0（GPIO 功能）
  #      · 3.3V 电平（PAD_3V_DS4）
  #    引脚 32/36/37/38/40（GPIO_34/35/33/46/37）虽然官方图标着 GPIO，
  #    但设备树里没有配置为 GPIO，写 GPIO 寄存器不会有任何输出。
  #    详见 docs/技术文档.md §6.4

  # sysfs PWM 参数（driver=sysfs_pwm 时使用）
  pwm_chip: 0            # /sys/class/pwm/pwmchip0
  pwm_channel: 0         # 该 chip 的第 0 路

  # 舵机脉宽范围（单位：微秒）。50Hz → 周期 20000us
  period_us: 20000       # 20ms = 50Hz，绝大多数模拟舵机
  #
  # ---- 实测标定结果（2026-10-24 重新标定，本项目的舵机+夹爪）----
  #   脉宽 550us  → 夹爪完全闭合（两指接触，机械端点）
  #   脉宽 600us  → 刚好夹住葡萄大小的物体（约 22mm）★ 实际工作点
  #   脉宽 1450us → 夹爪完全张开（约 100mm）
  #
  #   ⚠️ 行程高度非线性（齿轮 + 平行四连杆）：
  #        550→600us  开口 0→约 20mm   （0.4 mm/us，非常敏感）
  #        600→1450us 开口 20→约 100mm （0.094 mm/us）
  #      所以"闭合端"每 1us 都顶得上张开端 4us，调参要小心。
  #
  #   ---- 装上传感器后的重新标定（2026-10-25）----
  #   传感器厚约 15mm，装在左夹指内侧 → 有效开口 = 原开口 - 15mm
  #
  #   实测：脉宽一路降到 650us，两指仍未接触（力读数平稳无趋势）
  #   → **650us 是经过实测验证的安全下限**
  #
  #   推算的有效开口：
  #     650us → 约 10mm（安全 ✅）
  #     760us → 约 20mm ← 夹 22mm 葡萄的工作点
  #     585us → 约 3mm （接近接触，会压到传感器）
  #
  # ★★ 2026-10-27 实测：双传感器下的接触点 = 700us ★★
  #
  #   实测方法：apps/servo_step_test.py --floor 700 --step 10
  #             逐步下降，受力面刚碰上时停下 → 700us
  #
  #   由这一次测量可反解出几何模型：
  #     脉宽 550us → 开口   0mm（裸夹爪机械端点）
  #     脉宽 600us → 开口  22mm（此前实测可夹 22mm 物体）
  #     脉宽 700us → 开口  31.2mm = 两只传感器总厚度
  #                → 每只传感器约 15.6mm ✅ 与单只时代的估算一致
  #
  #     开口(脉宽) = 22 + (脉宽 − 600) × 0.0918   [mm]
  #     反解：脉宽(开口) = 600 + (开口 − 22) / 0.0918
  #
  #   下限取 "接触点 + 50us 余量" = 750us。
  #   ⚠️ 低于 750us 就是在压两只传感器，长期会损坏。
  pulse_min_us: 750
  pulse_max_us: 1450     # 全开（实测 1500 - 50 余量）

  # 夹爪机械行程对应的舵机角度（度）
  # 注意：这里的"角度"是本舵机自己的坐标系，
  #       angle_close_deg=0 对应最小脉宽（全闭），angle_open_deg=180 对应最大脉宽（全开）
  angle_close_deg: 0.0    # 完全闭合
  angle_open_deg: 180.0   # 完全张开

  # 舵机上电后的初始角度（开口状态，方便放入目标）
  angle_home_deg: 180.0

  # 输出变化速率上限（度/秒）。防止瞬间跳变导致冲击。
  max_rate_deg_per_s: 200.0

# ---------------------------------------------------------------------------
# 压力传感器
# ---------------------------------------------------------------------------
sensor:
  # 传感器类型：
  #   "ps01"       — 单只 PS01 光学力传感器（UART）
  #   "ps01_dual"  — ★ 双只 PS01，左右夹指各一只（当前状态）
  #   "ads1115"    — I2C，16bit，4通道
  #   "mcp3008"    — SPI，10bit，8通道
  #   "k1_saradc"  — K1 片内 ADC（若 40Pin 引出）
  #   "simulated"  — 模拟
  #
  # 注意：只要 ps01.port_b 有值，就自动进入双传感器模式（不必改这里）
  adc: ps01_dual

  # ---- PS01 光学力传感器 ----
  ps01:
    port: /dev/ttyUSB0     # 传感器 A（左夹指），经 CH340 USB-TTL
    port_b: /dev/ttyUSB1   # 传感器 B（右夹指），经 PL2303 USB-TTL
    baudrate: 115200
    warmup_s: 1.0          # 启动后等读数稳定的时间
    pd_channel: 1          # 双传感器模式下用哪个 PD 通道（PD1 响应最好）
    #
    # ⚠️ 设备名会随插入顺序变化。最可靠的是用 /dev/serial/by-path/ 下的名字：
    #     ls -l /dev/serial/by-path/
    #   它按 USB 物理端口位置命名，固定插口就不会变。
    #   本机实测：
    #     platform-xhci-hcd.0.auto-usb-0:1.1:1.0-port0 → ttyUSB0（CH340）
    #     platform-xhci-hcd.0.auto-usb-0:1.2:1.0-port0 → ttyUSB1（PL2303）
    #
    # 单传感器模式下才用这个（双传感器模式忽略它）
    channel_map:
      0: 1                 # channel 0 → PD1
      1: 2                 # channel 1 → PD2

  # ---- 其他 ADC（保留，本项目未使用）----
  ads1115:
    i2c_bus: 1           # /dev/i2c-1
    address: 0x48        # ADDR 接地=0x48, VDD=0x49, SDA=0x4A, SCL=0x4B
    gain: 1              # PGA: 1=±4.096V, 2=±2.048V, 4=±1.024V
    sample_rate: 128     # SPS: 8/16/32/64/128/250/475/860

  mcp3008:
    spi_bus: 0
    spi_device: 0
    vref: 3.3

  # 两个"力通道"的 ADC 通道号
  #
  # ⚠️ 当前只有 1 个 PS01 传感器（装在左夹指），所以两路都指向 PD1。
  #    依据：对称平行夹爪夹持静止物体时，左右两侧法向力必然相等
  #    （牛顿第三定律），因此测一侧即等于夹持力。
  #
  #    第二个传感器到货后：
  #      channel_left: 0    （传感器 A 的 PD1）
  #      channel_right: 1   （传感器 B 的 PD1，需扩展 Ps01Adc 支持双端口）
  #
  # ★ 2026-10-25 更新：第二只传感器已到，双传感器驱动已实现
  #    Ps01DualAdc 的通道定义：
  #      0 → 传感器 A 的 PD1（左夹指）
  #      1 → 传感器 B 的 PD1（右夹指）
  #      2 → (A+B)/2
  #      3 → |A-B|
  #    力控用 0/1 两路，ForceSensorPair 会自动取平均（force_n）
  #    并用 max 做安全判定、用差做偏心检测。
  channel_left: 0
  channel_right: 1

  # ---- 标定：raw 读数 → 牛顿 ----
  # 模型：  F = force_max_n * ((raw - raw_zero) / raw_span) ^ gamma
  #
  # ⚠️ 两只传感器的基线不同，必须各自标定。
  calib:
    # ---- 传感器 A（左，CH340 / ttyUSB0）----
    #   2026-10-23 用 258g 牛奶盒标定：空载 683,457 → 加载 687,413
    #   灵敏度 = 3956 / 2.53 = 1564 计数/牛顿
    #   raw_span = 1564 × 10 = 15,640
    #
    #   ⏳ 装到右夹指上的第二只到货、且 A 也重新装好后，两只都要重新 tare
    left:
      raw_zero: 682700.0     # ⏳ 装机后需重新 tare（双传感器实测典型值）
      raw_span: 15640.0
      force_max_n: 10.0
      gamma: 1.0
    # ---- 传感器 B（右，PL2303 / ttyUSB1）----
    #   2026-10-25 双传感器实测：典型读数约 691,900（均值 693,433 被尖峰拉高）
    #   噪声 σ = 2,986 计数（0.431%）—— 比 A 的 4,199 更安静
    #   灵敏度沿用同型号的 1,564 计数/牛顿 ⏳ 待用砝码复核
    right:
      raw_zero: 691900.0     # ⏳ 装机后需重新 tare
      raw_span: 15640.0
      force_max_n: 10.0
      gamma: 1.0
    #
    # ---- 双传感器的实测结论（2026-10-25）----
    #   噪声：A σ=4,199（0.613%）  B σ=2,986（0.431%）
    #   相关系数 ρ(A,B) = +0.279（弱相关）
    #
    #   差分 A-B   → σ=4,421（1.05x，比单只 A 还差）❌ 不可用
    #   平均 (A+B)/2 → σ=2,896（0.69x，降噪 31%）   ✅ 采用
    #
    #   依据：对称夹持静止物体时左右法向力必然相等（牛顿第三定律），
    #        所以两只测的是同一个力学量，平均是合理的。
    #
    #   ⚠️ 已知限制：噪声主要是低频漂移而非白噪声，延长平均窗口收益递减。
    #      实测 0.25s 窗口 σ≈0.66N，2.0s 窗口 σ≈0.22N。
    #      因此力控主控制量是**位置**，力用于安全上限 + 提前停止 + 事后验证。

  # 采样与滤波
  # PS01 实测约 135 Hz；滑动平均窗口 7 → 约 52ms 延迟
  sample_hz: 135
  filter_window: 7        # 滑动平均窗口（奇数）
  # 中值滤波窗口，用于抑制单点尖峰（0 = 关闭）
  median_window: 5

# ---------------------------------------------------------------------------
# 夹取控制
# ---------------------------------------------------------------------------
grip:
  # ---- 力的设定值 ----
  # 葡萄破裂力约 1~3N。0.8N 留 3 倍以上安全裕度，
  # 配合硅胶垫(μ≈1.0)足够吊起 12g 的葡萄。
  target_force_n: 0.8     # 目标夹持力
  force_approach_n: 0.25  # 接触判定阈值（超过它认为已接触）
  force_max_n: 1.5        # 硬上限，超过立即反向松开 ★安全
  force_release_n: 0.05   # 松手时降到这个力以下算完全释放

  # ---- 接近阶段 ----
  # 闭合时的速度限幅（度/秒）。慢速逼近是防止过冲的第一道防线。
  # 葡萄（直径 22mm）在典型夹爪上只对应 20~30° 的舵机行程，
  # 60°/s 约 0.4s 完成逼近；25°/s 要 1.5s 以上，现场演示太拖。
  # 上真机后如果发现接触冲击明显，先降到 30°/s 再测。
  approach_rate_deg_per_s: 60.0
  # 接触后期望的力的上升速率（N/s）。越小越安全，但越慢。
  force_ramp_n_per_s: 1.5
  # 接触判定需要连续满足的采样次数（去抖）
  contact_confirm_samples: 5

  # ---- 力闭环 PI 参数 ----
  # 输出是"期望的闭合速度"，单位 度/秒
  kp_deg_per_s_per_n: 60.0
  ki_deg_per_s_per_n_s: 40.0
  integral_limit: 30.0    # 抗积分饱和

  # ---- 保持阶段 ----
  hold_time_s: 2.0        # 夹住后保持多久（模拟"搬运"）
  # 保持期间的力容差，超出范围则微调
  hold_tolerance_n: 0.15

  # ---- 释放阶段 ----
  release_rate_deg_per_s: 120.0

  # ---- 超时保护 ----
  timeout_approach_s: 8.0 # 闭合阶段超时
  timeout_hold_s: 10.0

# ---------------------------------------------------------------------------
# 按物体类别自适应的抓取力策略
# ---------------------------------------------------------------------------
# 设计思想
# --------
# "识别物体类型 → 选择夹取策略"。分类模型只回答"这是什么"，
# 而"该用多大力"必须靠实测标定（不能训练出来）。
#
#   · 目标力：要远高于"吊住所需"，远低于"物体破裂力"（取中间偏保守）
#   · 硬上限：物体破裂力 × 0.6（必须实测，不能猜）
#   · 预闭合：位置快速闭合到"接触点前一点"，再由力闭环做微调
#
# ⚠️ 下面 egg / pingpong / grape 的数值都是**待实测的估计值**，
#    拿到实物后必须用 apps/force_loop_test.py --target 3.0 做破裂力实验，
#    把实测破裂力 × 0.6 填进 force_max_n。详见 docs/接下来的方案.md 任务 3.1
# ---------------------------------------------------------------------------
# ★★ 2026-10-27 重算：装上第二只传感器后，脉宽全部上移 ★★
#
#   原因：夹住直径 D 的物体，需要"裸指开口 = D + 两只传感器总厚 31.2mm"。
#   公式（由 700us 接触点反解，见 servo.pulse_min_us 处的推导）：
#      接触脉宽(D) = 600 + (D + 31.2 − 22) / 0.0918
#
#   各物体（估算直径 → 接触脉宽 → 夹持位置取接触前 15us）：
#      葡萄   22mm → 940us → 925us
#      鸡蛋   40mm → 1136us → 1120us
#      乒乓球 40mm → 1136us → 1120us
#
#   ⚠️⚠️ 以上是**几何推算值，不是实测**。
#       必须用实物标定：把物体放在两指之间，跑
#           sudo python3 scripts/servo_force_limit_finder.py --step 5 --measure 0.8
#       它会扫描下降并在"力刚开始上升"的位置停下 —— 那就是接触点。
#       grasp_pulse = 接触点 − 15us；approach_pulse = 接触点 + 60us。
# ---------------------------------------------------------------------------
grasp_policy:
    # 葡萄：⭐⭐ 2026-10-27 实测标定（两指间放真葡萄，逐步下降测力）⭐⭐
    #
    #   实测数据（Δ 计数 → 牛顿，按 1,564 计数/N）：
    #     脉宽    ΔA      ΔB     A的力    B的力    平均力
    #     880     +28    -130    0.02N   0.00N    0.01N   ← 还没接触
    #     870    +538     +52    0.34N   0.03N    0.19N   ← 刚接触
    #     860    +574    +182    0.37N   0.12N    0.24N   ← 舒适区
    #     850  +2,574    +290    1.65N   0.19N    0.92N   ← ⚠️ 陡升
    #     840  +3,304    +552    2.11N   0.35N    1.23N
    #     820  +4,002  +1,074    2.56N   0.69N    1.63N   ← 已明显压到葡萄
    #
    #   ★ 关键发现：接触点在 870us 附近，**力上升极陡** ——
    #     860→850us 这 10us 内平均力从 0.24N 跳到 0.92N。
    #     也就是说葡萄的安全脉宽窗口只有约 10us 宽。
    #     → 因此 probe_step 必须用 2us（默认 4us 一步就跨过整个安全区）
    #
    #   ⚠️ 两只传感器受力差 3.7 倍（A 2.56N vs B 0.69N）：
    #      可能是葡萄偏心，也可能是 B 的灵敏度未单独标定
    #      （B 沿用了 A 的 1,564 计数/N）。控制用平均值，暂不影响。
    #
    #   ⏳ 待补：葡萄的真实破裂力（用一颗葡萄做破坏性测试）
    grape:
      # ⭐ 控制方式：**力到位就停**（不是走到固定位置）
      #
      #   为什么要改：实测发现"固定 grasp_pulse=856us"只能夹住某一颗葡萄，
      #   换一颗不同大小的就不行 —— 因为固定位置只能对应一个直径。
      #   改成"闭合到力达到 target_force_n 就停"后，大小不同的葡萄会自动适配：
      #     小葡萄 → 接触点更靠下 → 力到 0.9N 时停在较深的位置
      #     大葡萄 → 接触点更靠上 → 力到 0.9N 时停在较浅的位置
      #
      #   target_force_n: 0.9N 的来历（实测 + 摩擦力学）：
      #     葡萄重 12g = 0.118N；两指法向力 N，摩擦系数 μ≈0.3
      #     可吊住的摩擦力 = 2μN = 0.6N（当 N=1.0N）→ 余量 5 倍 ✅
      #     实测 0.4~0.5N 时"看起来稳定"但提起会滑落（余量仅 1.5 倍）
      #
      #   ⭐ 2026-10-27 调整：0.9 → 1.5N
      #     用户实测反馈：葡萄比预想的结实（1.6N 未损坏），且 0.9N 仍夹不住。
      #     提高到 1.5N 后摩擦力余量 = 2×0.3×1.5/0.118 ≈ 7.6 倍 ✅
      #   ⭐ 2026-11-02 回调 2.0 → 1.2N（实测教训）
      #
      #     之前调到 2.0N，结果**永远到不了**：某颗葡萄从接触点 840us
      #     一路闭合到机械下限 750us，力只涨到 1.37N。
      #     力上升速度和葡萄大小/软硬强相关 —— 大而硬的葡萄在
      #     "闭到底"之前给不出 2.0N。
      #
      #     1.2N 的依据：摩擦力余量 2×0.3×1.2/0.118 ≈ 6 倍，已经足够；
      #     而且这个值在机械行程内可达（实测 750us 时能到 1.37N）。
      #
      #     ★ 目标力必须"在机械行程内可达"，否则控制环永远不收敛。
      #       如果某颗葡萄就是夹不紧，脚本会在到达下限时按
      #       「力够不够最低要求」来判定，而不是死等到目标值。
      target_force_n: 1.2
      force_max_n: 2.5       # ⏳ 待实测破裂力；实测 2.56N 时葡萄未损坏
      approach_pulse: 940    # 预闭合位置（要早于所有尺寸葡萄的接触点）
      grasp_pulse: 750       # ★ 机械安全下限，**不是夹持位置**（见下方说明）
    # 鸡蛋：约 55g、40mm，侧压破裂力估计 20~30N（待实测）
    egg:
      target_force_n: 1.5
      force_max_n: 6.0       # ⏳ 待实测
      approach_pulse: 1180   # ⏳ 几何推算，待实物标定
      grasp_pulse: 750       # ★ 机械安全下限
    # 乒乓球：约 2.7g、40mm，压扁力估计 5~10N（待实测）
    pingpong:
      target_force_n: 0.3
      force_max_n: 2.0       # ⏳ 待实测
      approach_pulse: 1180   # ⏳ 几何推算，待实物标定
      grasp_pulse: 750       # ★ 机械安全下限
    # 未知物体：一律最保守 —— "最多是掉，不会破"
    # 策略：低力目标 + 靠 grasp_with_verify 的"滑移则收紧"重试逐步加紧
    unknown:
      target_force_n: 0.3
      force_max_n: 0.8
      approach_pulse: 1150   # ⏳ 待标定
      grasp_pulse: 750       # ★ 机械安全下限
  #
  # ★★ 为什么 grasp_pulse 全部填 750（机械安全下限）★★
  #
  #   踩过的坑（2026-10-27）：曾把 grape 的 grasp_pulse 按标定值设成 835us，
  #   结果**小一点的葡萄夹不起来** —— 835us 时力才 0.46N，
  #   而夹爪已经到"最深允许"停住了，没能继续闭合到力达标。
  #
  #   正确的分工：
  #     · 能闭多深 = **机械约束**（750us，两只传感器不碰上即可，与物体无关）
  #     · 夹多大力 = **物体相关**（葡萄 1.5N / 鸡蛋 1.5N / 乒乓球 0.3N）
  #   所以最深位置统一用机械下限；物体差异只体现在"力目标"上。
  #   这样大小不同的同类物体都能自适应。
  #
  #   approach_pulse 则确实是物体相关的：它要"早于该物体的接触点"，
  #   物体越大接触点越靠上，所以鸡蛋/乒乓球的 approach 比葡萄大。
  #
  #   ⚠️ 下面"主控制量是位置"那段说明已过时 ——
  #      最终实现是"力到位就停"（单边阈值 + 连续 2 次确认），见 §控制结构演进。
  #
  # ⚠️ 重要：为什么主控制量是"位置"而不是"力"？
  #    PS01 单通道有效更新率约 21Hz，单点噪声 σ≈2.7N。
  #    即使 2.0s 窗口（约 42 个独立样本）σ 仍有 0.42N，
  #    而 grape 的目标力只有 0.4N —— **噪声大于目标**。
  #    实测踩坑：900us 两指大开着，也报"力已到目标"（噪声误触发）。
  #    所以：位置负责"夹到多紧"（确定、可重复），
  #          力负责"安全上限 + 提前停止 + 事后验证"。
  #    这套分工在 docs/技术文档.md 里有完整的数据支撑。

# ---------------------------------------------------------------------------
# 安全监控（独立于控制逻辑，任一触发即急停）
# ---------------------------------------------------------------------------
safety:
  enable: true
  # 力超过 force_max_n 后，反向松开这么多度
  release_backoff_deg: 20.0
  # 失稳检测：力在上升但效率太低 → 判定葡萄在滑移
  # 如果 (实际力上升速率) < (期望速率 * 该比例) 且持续 N 秒 → 报警
  slip_ratio_threshold: 0.2
  slip_detect_window_s: 1.5
  # 主循环心跳超时（秒）
  heartbeat_timeout_s: 0.5

# ---------------------------------------------------------------------------
# 视觉（阶段二，先占位）
# ---------------------------------------------------------------------------
vision:
  enable: false
  camera:
    device: /dev/video0
    width: 1280
    height: 720
    fps: 30
  # 检测方式："hsv" 传统方法（快，先跑通） 或 "yolo" NPU 推理（准）
  detector: hsv

  hsv:
    # 紫葡萄的 HSV 大致范围（OpenCV H:0-179, S:0-255, V:0-255）
    # 需要按实际光照调整，见 apps/calibrate_hsv.py
    h_min: 130
    h_max: 175
    s_min: 60
    s_max: 255
    v_min: 40
    v_max: 255
    min_area_px: 800

  yolo:
    model_path: models/grape_yolov8n.kmodel
    conf_threshold: 0.5

  # 手眼标定：像素坐标 → 夹爪平面物理坐标（mm）
  # 用 apps/calibrate_handeye.py 标定
  handeye:
    # 简单的平面仿射变换（4 个参数），假设相机垂直向下固定
    mm_per_px_x: 0.25
    mm_per_px_y: 0.25
    offset_x_mm: 0.0
    offset_y_mm: 0.0

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
logging:
  level: INFO              # DEBUG / INFO / WARNING / ERROR
  file: logs/gripper.log
  console: true
  # 每次夹取循环导出一行 CSV，用于事后分析力曲线
  csv_file: logs/grip_trace.csv
